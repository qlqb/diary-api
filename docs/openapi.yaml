components:
  schemas:
    RoutineSaveRequest:
      type: object
      properties:
        courseId:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 200
          minLength: 0
        location:
          type: string
          maxLength: 100
          minLength: 0
        daysOfWeek:
          type: array
          items:
            type: string
            enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          uniqueItems: true
        startTime:
          type: string
        endTime:
          type: string
        effectiveFrom:
          type: string
          format: date
        effectiveUntil:
          type: string
          format: date
      required:
      - effectiveFrom
      - endTime
      - startTime
      - title
    RoutineExceptionResponse:
      type: object
      properties:
        routineExceptionId:
          type: integer
          format: int64
        routineId:
          type: integer
          format: int64
        exceptionDate:
          type: string
          format: date
        type:
          type: string
          enum:
          - SKIP
          - MOVED
        movedDate:
          type: string
          format: date
        movedStartTime:
          type: string
        movedEndTime:
          type: string
        movedLocation:
          type: string
        note:
          type: string
    RoutineResponse:
      type: object
      properties:
        routineId:
          type: integer
          format: int64
        courseId:
          type: integer
          format: int64
        title:
          type: string
        location:
          type: string
        daysOfWeek:
          type: array
          items:
            type: string
            enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          uniqueItems: true
        startTime:
          type: string
        endTime:
          type: string
        effectiveFrom:
          type: string
          format: date
        effectiveUntil:
          type: string
          format: date
        ended:
          type: boolean
        crossesMidnight:
          type: boolean
        hasFutureMovedDate:
          type: boolean
        exceptions:
          type: array
          items:
            $ref: "#/components/schemas/RoutineExceptionResponse"
    RoutineExceptionSaveRequest:
