spring.application.name=diary-api

# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8080}

spring.profiles.active=local
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# DataSource (MySQL)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# MyBatis
# ===============================
mybatis.mapper-locations=classpath:mapper/**/*.xml

# ===============================
# Logging (SQL ???)
# ===============================
logging.level.com.jungwoo.project.memo=debug
logging.level.jdbc.sqlonly=debug

# ===============================
# Spring AI (OpenAI)
# ===============================
# AI_PROVIDER=none 이거나 OPENAI_API_KEY가 없으면 서버 부팅/테스트는 정상 동작하고,
# AI 상담 호출 시에만 503 AI_NOT_CONFIGURED를 반환한다.
spring.ai.model.chat=${AI_PROVIDER:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5-mini}
# 답변+구조화 JSON 합쳐 출력 상한을 둔다 (섹션 9: 출력 최대 약 800~1000토큰 + JSON 여유분).
spring.ai.openai.chat.options.max-tokens=1200

# 429/일시 오류에 과도하게 자동 재시도하지 않는다 (최대 2회, 짧은 backoff).
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1000
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=5000

# ===============================
# AI 상담 컨텍스트/사용량 제어
# ===============================
ai.context.recent-message-limit=6
ai.context.max-input-tokens=6000
ai.context.max-output-tokens=1000
ai.usage.daily-limit=${AI_DAILY_LIMIT:50}
ai.usage.monthly-limit=${AI_MONTHLY_LIMIT:1000}

