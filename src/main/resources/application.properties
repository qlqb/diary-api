spring.application.name=diary-api

# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8080}

spring.profiles.active=local
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# DataSource (MySQL)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# MyBatis
# ===============================
mybatis.mapper-locations=classpath:mapper/**/*.xml

# ===============================
# Logging (SQL ???)
# ===============================
logging.level.com.jungwoo.project.memo=debug
logging.level.jdbc.sqlonly=debug

# ===============================
# Spring AI (OpenAI)
# ===============================
# AI_PROVIDER=none 이거나 OPENAI_API_KEY가 없으면 서버 부팅/테스트는 정상 동작하고,
# AI 상담 호출 시에만 503 AI_NOT_CONFIGURED를 반환한다.
spring.ai.model.chat=${AI_PROVIDER:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5-mini}
# 답변+구조화 JSON 합쳐 출력 상한을 둔다 (섹션 9: 출력 최대 약 800~1000토큰 + JSON 여유분).
# gpt-5 계열(기본 모델)은 reasoning 모델이라 max_tokens가 아니라 max_completion_tokens를
# 요구한다 — max-tokens를 쓰면 OpenAI가 그 필드를 거부한다.
spring.ai.openai.chat.options.max-completion-tokens=1200

# 사용자 메시지 1개당 OpenAI 호출은 최대 1회다. 재시도를 허용하면 이 보장이 깨지므로
# Spring AI 자체 재시도(RetryTemplate)도 끈다 — Reactor retry()/retryWhen()도 코드에서 쓰지 않는다.
spring.ai.retry.max-attempts=1

# ===============================
# AI 상담 컨텍스트/사용량 제어
# ===============================
ai.context.recent-message-limit=6
ai.context.max-input-tokens=6000
ai.context.max-output-tokens=1000
# 사용자별 저장된 시간대가 아직 없을 때 쓰는 기본값(User 엔티티에 시간대 컬럼 없음).
ai.context.default-time-zone=${AI_DEFAULT_TIME_ZONE:Asia/Seoul}
ai.usage.daily-limit=${AI_DAILY_LIMIT:50}
ai.usage.monthly-limit=${AI_MONTHLY_LIMIT:1000}

# ===============================
# AI 상담 턴 타임아웃 / 대화방 동시 요청 차단
# ===============================
# 한 턴(스트리밍 포함)이 이 시간을 넘기면 서버가 스스로 종료한다 — 재호출하지 않는다.
ai.request.timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:90}
# 서버 비정상 종료로 남은 오래된 PROCESSING을 회수하는 기준 = timeout + 이 여유 버퍼.
# 아직 살아있을 가능성이 있는 요청을 임의로 탈취하지 않기 위한 여유분이다.
ai.conversation.stale-lock-buffer-seconds=${AI_STALE_LOCK_BUFFER_SECONDS:30}

