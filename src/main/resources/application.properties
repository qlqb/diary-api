spring.application.name=diary-api

# ===============================
# Server
# ===============================
server.port=8080

spring.profiles.active=local
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# DataSource (MySQL)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# MyBatis
# ===============================
mybatis.mapper-locations=classpath:mapper/**/*.xml

# ===============================
# Logging (SQL ???)
# ===============================
logging.level.com.jungwoo.project.memo=debug
logging.level.jdbc.sqlonly=debug

# ===============================
# Spring AI (OpenAI)
# ===============================
# AI_PROVIDER=none 이거나 OPENAI_API_KEY가 없으면 서버 부팅/테스트는 정상 동작하고,
# AI 제안 생성 호출 시에만 503 AI_NOT_CONFIGURED를 반환한다.
spring.ai.model.chat=${AI_PROVIDER:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5-mini}

