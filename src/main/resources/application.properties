spring.application.name=diary-api

# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8080}

spring.profiles.active=local
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# DataSource (MySQL)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# MyBatis
# ===============================
mybatis.mapper-locations=classpath:mapper/**/*.xml

# ===============================
# Logging (SQL ???)
# ===============================
logging.level.com.jungwoo.project.memo=debug
logging.level.jdbc.sqlonly=debug

# ===============================
# Spring AI (OpenAI)
# ===============================
# AI_PROVIDER=none 이거나 OPENAI_API_KEY가 없으면 서버 부팅/테스트는 정상 동작하고,
# AI 상담 호출 시에만 503 AI_NOT_CONFIGURED를 반환한다.
spring.ai.model.chat=${AI_PROVIDER:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5-mini}
# 답변+구조화 JSON 합쳐 출력 상한을 둔다. gpt-5 계열(기본 모델)은 reasoning 모델이라
# max_tokens가 아니라 max_completion_tokens를 요구한다 — max-tokens를 쓰면 OpenAI가 그
# 필드를 거부한다. max_completion_tokens에는 사용자에게 보이는 텍스트뿐 아니라 내부
# reasoning 토큰도 포함된다 — 2026-08-06 실측(input=1772, output=2400, output이 상한과
# 정확히 일치)으로 reasoning이 상한을 전부 써버려 최종 reply/구조화 JSON이 완전히 빈 채로
# CHAT으로 잘못 폴백되는 것을 확인했다. reasoning-effort/verbosity를 low로 낮춰 reasoning에
# 쓰는 토큰 자체를 줄이고, 그래도 남는 여유를 위해 상한도 6000으로 올렸다.
#
# 아래 세 키는 Spring AI 2.0의 공식(비-deprecated) 프로퍼티다
# (spring-ai-autoconfigure-model-openai의 spring-configuration-metadata.json 기준).
# 기존 spring.ai.openai.chat.options.max-completion-tokens/reasoning-effort/verbosity는
# deprecated alias로 계속 동작은 하지만(replacement 힌트로 확인) 새 코드에서는 공식 키만 쓴다.
spring.ai.openai.chat.max-completion-tokens=${OPENAI_MAX_COMPLETION_TOKENS:6000}
# minimal은 계획 항목을 여러 개로 분해하는 판단에 너무 약할 수 있어 low를 쓴다.
spring.ai.openai.chat.reasoning-effort=${OPENAI_REASONING_EFFORT:low}
spring.ai.openai.chat.verbosity=${OPENAI_VERBOSITY:low}

# 사용자 메시지 1개당 OpenAI 호출은 최대 1회다. 재시도를 허용하면 이 보장이 깨지므로
# Spring AI 자체 재시도(RetryTemplate)도 끈다 — Reactor retry()/retryWhen()도 코드에서 쓰지 않는다.
spring.ai.retry.max-attempts=1

# ===============================
# AI 상담 컨텍스트/사용량 제어
# ===============================
ai.context.recent-message-limit=6
ai.context.max-input-tokens=6000
ai.context.max-output-tokens=1000
# 장기 컨텍스트(user_contexts, ACTIVE/STALE) 중 상담 프롬프트에 담을 최대 개수. 최근 갱신
# 순으로 이 개수까지만 보낸다 — max-input-tokens 예산을 장기 컨텍스트가 혼자 다 쓰지 않게 한다.
ai.context.long-term-limit=30
# 사용자별 저장된 시간대가 아직 없을 때 쓰는 기본값(User 엔티티에 시간대 컬럼 없음).
ai.context.default-time-zone=${AI_DEFAULT_TIME_ZONE:Asia/Seoul}
ai.usage.daily-limit=${AI_DAILY_LIMIT:50}
ai.usage.monthly-limit=${AI_MONTHLY_LIMIT:1000}

# ===============================
# AI 상담 턴 타임아웃 / 대화방 동시 요청 차단
# ===============================
# 한 턴(스트리밍 포함)이 이 시간을 넘기면 서버가 스스로 종료한다 — 재호출하지 않는다.
ai.request.timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:90}
# 서버 비정상 종료로 남은 오래된 PROCESSING을 회수하는 기준 = timeout + 이 여유 버퍼.
# 아직 살아있을 가능성이 있는 요청을 임의로 탈취하지 않기 위한 여유분이다.
ai.conversation.stale-lock-buffer-seconds=${AI_STALE_LOCK_BUFFER_SECONDS:30}

# ===============================
# 7일 범위 일정 후보 배치 (Timefold Solver)
# ===============================
# Solver는 상시 실행되지 않는다 — "다시 배치"를 누를 때마다 짧게 한 번 돌고 끝난다.
# 타임아웃은 짧게(기본 5초) 잡는다: 후보가 최대 5개, 후보 시간 슬롯 수도 크지 않다.
scheduling.solver.timeout-seconds=${SCHEDULING_SOLVER_TIMEOUT_SECONDS:5}
# 계획 범위 최대 일수(오늘 포함).
scheduling.horizon.max-days=${SCHEDULING_HORIZON_MAX_DAYS:7}
# 후보 시간 슬롯을 몇 분 단위로 끊어 생성할지.
scheduling.availability.slot-granularity-minutes=${SCHEDULING_SLOT_GRANULARITY_MINUTES:15}
scheduling.availability.default-time-zone=${AI_DEFAULT_TIME_ZONE:Asia/Seoul}

