plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jeongwoo.project'
version = '0.0.1-SNAPSHOT'
description = 'diary-api'

repositories {
    mavenCentral()
}

java {
    toolchain {
        // Timefold Solver 2.x는 Java 21+를 요구한다(2026-08-06 기준 공식 최신 안정 버전 2.4.0).
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}


ext {
    springAiVersion = '2.0.0'
    timefoldVersion = '2.4.0'
}

dependencies {
    implementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    // 계획 자료 선택의 입력 토큰 추정(o200k_base). Spring AI가 이미 같은 버전을 끌어오지만, 직접 쓰므로 명시한다.
    implementation 'com.knuddels:jtokkit:1.1.0'

    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    // Timefold는 Spring Boot 4용 공식 스타터가 아직 없어 core만 쓴다. Solver는 사용자 요청 시
    // 짧게(초 단위 termination) 동기 실행하는 용도로만 쓰고, 상시 SolverManager/데몬으로
    // 구동하지 않는다 — scheduling.solver.SchedulingSolverService 참고.
    implementation "ai.timefold.solver:timefold-solver-core:${timefoldVersion}"
    // Material Agent 입력용 텍스트 추출. 스캔 이미지 PDF의 OCR은 이번 범위에 넣지 않는다
    // (텍스트 레이어가 없으면 추출 실패로 명확히 처리한다).
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    // HWP 5.0 본문 추출. 의존성 없는 순수 자바 라이브러리(Apache-2.0).
    implementation 'kr.dogfoot:hwplib:1.1.11'
    implementation 'kr.dogfoot:hwpxlib:1.0.9'
    // ZIP 가져오기: 항목의 UTF-8 플래그·CP949 이름·심볼릭 링크 판별이 필요해 java.util.zip 대신 쓴다.
    // POI가 이미 끌어오는 버전이지만 직접 쓰므로 명시한다.
    implementation 'org.apache.commons:commons-compress:1.26.2'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.0'
    // Timefold 2.x부터 ConstraintVerifier가 timefold-solver-core 안으로 들어왔다
    // (ai.timefold.solver.core.api.score.stream.test) — 별도 timefold-solver-test
    // 아티팩트는 2.x 라인에 없다(1.x까지만 배포됨).
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1"
}

tasks.named('test') {
    useJUnitPlatform()

    /*
      테스트 로그를 관찰용 로그 파일과 분리한다.

      logging.file.name의 목적은 30일 자기 검증에서 "연결 제안: trigger=..." 같은 줄을
      며칠 단위로 세는 것이다. 테스트도 같은 파일에 쓰면 목 호출이 만든 줄이 섞여 집계가
      그대로 오염된다 — MaterialLinkProposalServiceTest만 해도 그 줄을 여러 번 찍는다.

      build/ 아래로 보낸다. 이미 gitignore 대상이고 clean으로 함께 지워진다.
    */
    systemProperty 'logging.file.name',
            layout.buildDirectory.file('logs/test.log').get().asFile.absolutePath

    /*
      자료 자동 분석 worker는 테스트에서 끈다. @SpringBootTest가 로컬 memo DB에 붙는데, worker가
      살아 있으면 테스트 컨텍스트가 뜨는 동안 실제 사용자의 자료를 집어 모델을 부른다.
      작업 등록·선점·결과 저장 자체는 테스트가 서비스 메서드를 직접 불러 검증한다.
    */
    systemProperty 'material.analysis.worker.enabled', 'false'

    /*
      프로젝트 정리 worker도 같은 이유로 끈다. 테스트가 project_tidy_jobs에 QUEUED 행을 만드는데
      (임대·경합 검증), 폴러가 살아 있으면 그 행을 집어 실제 모델을 부른다. 더 나쁜 것은 개발 중
      떠 있는 사용자 인스턴스가 devtools로 새 클래스를 올려 같은 DB의 그 행을 집는 경우다 —
      2026-09-13 작업에서 실제로 겪었다. 작업의 등록·선점·결과 저장은 테스트가 서비스 메서드를
      직접 불러 검증한다.
    */
    systemProperty 'project.tidy.worker.enabled', 'false'

    /*
      통합 테스트는 사용자의 memo DB에 붙지 않는다.

      2026-09-21 작업에서 실제로 사고가 났다. @SpringBootTest가 memo에 직접 붙던 탓에
      테스트가 만든 합성 자료의 소요 시간 표본 여덟 건이 material_analysis_timings에 남았고,
      그 표본은 사용자의 첫 "예상 분석 시간"을 1바이트짜리 시험 파일 기준으로 만들 뻔했다.
      worker를 끄는 것만으로는 부족하다 — 그건 테스트 프로세스 안의 폴러만 막을 뿐,
      같은 DB를 보는 다른 실행(IDE에 떠 있는 개발 서버)은 통제하지 못한다.

      그래서 붙는 DB 자체를 가른다. 스키마만 복제한 memo_test를 쓰고, 사용자 데이터는
      읽지도 쓰지도 않는다. 만드는 법: bash scripts/test-db/prepare-memo-test.sh
      (스키마가 바뀌면 다시 돌린다). -PtestDbUrl=... 로 다른 DB를 지정할 수 있다.

      격리하고 나서 알게 된 것: 계획·교재 쪽 DB 테스트 아홉 개는 "users 표의 첫 번째
      사용자"를 빌려 쓴다. memo에서 그것은 실제 계정(user_id=1)이었다 — 테스트 행이 실제
      사용자 이름으로 쓰이고 지워지고 있었다. memo_test에는 합성 사용자 하나만 있다.

      TestDatabaseIsolationTest가 이 설정이 실제로 먹었는지(붙은 스키마 이름이 memo가
      아닌지) 매 실행마다 확인한다. 설정이 조용히 풀리면 그 테스트가 먼저 깨진다.
    */
    systemProperty 'spring.datasource.url', (findProperty('testDbUrl')
            ?: 'jdbc:mysql://localhost:3306/memo_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8')

    /*
      업로드 파일도 사용자 개발 서버가 보는 ./data/materials가 아니라 build/ 아래에 쓴다.
      테스트가 만든 파일을 개발 서버의 자료함이 집어 목록에 섞이지 않게 한다.
    */
    systemProperty 'storage.materials.upload-dir',
            layout.buildDirectory.dir('test-materials').get().asFile.absolutePath

    /*
      -PexcludeDbTests: 앱 스키마가 있는 DB가 없는 환경(CI)에서 뺄 테스트.

      아래 서른일곱 개는 로컬 memo DB의 실제 테이블에 직접 INSERT/DELETE해서 SQL 자체를 검증한다 —
      Mockito로는 증명할 수 없는 것을 증명하는 테스트라 껍데기로 바꾸면 의미가 없다.
      레포에는 전체 스키마 파일이 없고 docs/sql은 증분 마이그레이션뿐이라 CI가 빈 DB에
      테이블을 만들 방법이 없다. 스키마를 레포에 넣게 되면 이 플래그를 지우고 전부 돌린다.

      ★ 목록을 늘릴 때 이 문장의 개수도 함께 고친다. 세지 않고 적어두면 어느 쪽이
      맞는지 알 수 없어지고, 그러면 주석이 코드를 설명하는 게 아니라 반박하게 된다.
    */
    if (project.hasProperty('excludeDbTests')) {
        filter {
            excludeTestsMatching 'com.jungwoo.project.memo.ai.AiMessageMapperTest'
            excludeTestsMatching 'com.jungwoo.project.memo.ai.AiTurnLifecycleServiceConcurrencyTest'
            excludeTestsMatching 'com.jungwoo.project.memo.plan.PlanVersionMapperTest'
            excludeTestsMatching 'com.jungwoo.project.memo.execution.ExecutionItemPlanningRangeMapperTest'
            excludeTestsMatching 'com.jungwoo.project.memo.plan.PlanConfirmAndPlacementIntegrationTest'
            excludeTestsMatching 'com.jungwoo.project.memo.material.linkproposal.MaterialLinkProposalApplyIntegrationTest'
            excludeTestsMatching 'com.jungwoo.project.memo.course.CourseTextbookMapperTest'
            excludeTestsMatching 'com.jungwoo.project.memo.routine.RoutineMapperTest'
            excludeTestsMatching 'com.jungwoo.project.memo.material.CourseMaterialAnalysisDraftUniquenessTest'
            excludeTestsMatching 'com.jungwoo.project.memo.commitment.CommitmentMapperTest'
            excludeTestsMatching 'com.jungwoo.project.memo.ai.PeriodPlanConversationIntegrationTest'
            excludeTestsMatching 'com.jungwoo.project.memo.plan.PlanDeadlineChainIntegrationTest'
            excludeTestsMatching 'com.jungwoo.project.memo.plan.provenance.PlanProvenanceIntegrationTest'
            excludeTestsMatching 'com.jungwoo.project.memo.commitment.CommitmentDerivedTravelMapperTest'
            excludeTestsMatching 'com.jungwoo.project.memo.commitment.DerivedTravelConcurrencyTest'
            excludeTestsMatching 'com.jungwoo.project.memo.ai.scheduleimport.ScheduleImageConfirmTest'
            excludeTestsMatching 'com.jungwoo.project.memo.ai.ScheduleSuggestionApplyBatchTest'
            excludeTestsMatching 'com.jungwoo.project.memo.plan.PlanConfirmRoutineRaceTest'
            excludeTestsMatching 'com.jungwoo.project.memo.scheduling.SchedulePreviewConcurrencyTest'
            excludeTestsMatching 'com.jungwoo.project.memo.material.analysis.MaterialAnalysisJobLeaseTest'
            excludeTestsMatching 'com.jungwoo.project.memo.assignment.CourseAssignmentServiceDbTest'
            excludeTestsMatching 'com.jungwoo.project.memo.learning.structure.TopicChangeProposalApplyDbTest'
            excludeTestsMatching 'com.jungwoo.project.memo.material.analysis.MaterialAnalysisResultRaceDbTest'
            excludeTestsMatching 'com.jungwoo.project.memo.ai.AiUsageLimitServiceDbTest'
            excludeTestsMatching 'com.jungwoo.project.memo.material.zip.MaterialZipImportDbTest'
            excludeTestsMatching 'com.jungwoo.project.memo.plan.PlanReplanConfirmIntegrationTest'
            excludeTestsMatching 'com.jungwoo.project.memo.plan.PlanDraftPersistenceDbTest'
            excludeTestsMatching 'com.jungwoo.project.memo.plan.PlanDailyRepeatIntegrationTest'
            excludeTestsMatching 'com.jungwoo.project.memo.learning.tidy.ProjectTidyApplyDbTest'
            excludeTestsMatching 'com.jungwoo.project.memo.learning.tidy.ProjectTidyRaceDbTest'
            excludeTestsMatching 'com.jungwoo.project.memo.learning.tidy.ProjectTidyResolveRaceDbTest'
            excludeTestsMatching 'com.jungwoo.project.memo.learning.tidy.ProjectTidyCarryOverDbTest'
            excludeTestsMatching 'com.jungwoo.project.memo.learning.tidy.ProjectTidySnapshotDbTest'
            excludeTestsMatching 'com.jungwoo.project.memo.learning.tidy.ProjectTidyLegacyTransitionDbTest'
            excludeTestsMatching 'com.jungwoo.project.memo.material.batch.MaterialAnalysisBatchDbTest'
            excludeTestsMatching 'com.jungwoo.project.memo.material.batch.MaterialAnalysisBatchReopenDbTest'
            excludeTestsMatching 'com.jungwoo.project.memo.support.TestDatabaseIsolationTest'
        }
    }
}
