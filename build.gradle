plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jeongwoo.project'
version = '0.0.1-SNAPSHOT'
description = 'diary-api'

repositories {
    mavenCentral()
}

java {
    toolchain {
        // Timefold Solver 2.x는 Java 21+를 요구한다(2026-08-06 기준 공식 최신 안정 버전 2.4.0).
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}


ext {
    springAiVersion = '2.0.0'
    timefoldVersion = '2.4.0'
}

dependencies {
    implementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    // Timefold는 Spring Boot 4용 공식 스타터가 아직 없어 core만 쓴다. Solver는 사용자 요청 시
    // 짧게(초 단위 termination) 동기 실행하는 용도로만 쓰고, 상시 SolverManager/데몬으로
    // 구동하지 않는다 — scheduling.solver.SchedulingSolverService 참고.
    implementation "ai.timefold.solver:timefold-solver-core:${timefoldVersion}"
    // Material Agent 입력용 텍스트 추출. 스캔 이미지 PDF의 OCR은 이번 범위에 넣지 않는다
    // (텍스트 레이어가 없으면 추출 실패로 명확히 처리한다).
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.0'
    // Timefold 2.x부터 ConstraintVerifier가 timefold-solver-core 안으로 들어왔다
    // (ai.timefold.solver.core.api.score.stream.test) — 별도 timefold-solver-test
    // 아티팩트는 2.x 라인에 없다(1.x까지만 배포됨).
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1"
}

tasks.named('test') {
    useJUnitPlatform()
}
